name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Core checks and iOS build
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Run protocol and payload checks
        run: swift run --jobs 4 TodooCoreChecks

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project TodooCard.xcodeproj \
            -scheme TodooCard \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TodooCardDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package simulator app
        run: |
          APP_PATH="$RUNNER_TEMP/TodooCardDerivedData/Build/Products/Debug-iphonesimulator/TodooCard.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$RUNNER_TEMP/TodooCard-Simulator.zip"

      - name: Upload simulator app
        uses: actions/upload-artifact@v6
        with:
          name: TodooCard-iOS-Simulator
          path: ${{ runner.temp }}/TodooCard-Simulator.zip
          if-no-files-found: error
          retention-days: 14
